<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2e9">
  <title>鹈鹕的慢骑时光</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f2e9;
      --ink: #304d43;
      --muted: #798478;
      --line: #d8ddd0;
      --orange: #c76e45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 6px;
    }
    .page {
      max-width: 1560px;
      min-height: 100svh;
      margin: 0 auto;
      padding: 0 54px;
      display: flex;
      flex-direction: column;
    }
    .masthead {
      min-height: 100px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 39px; height: 39px; }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: 3px; }
    .masthead-note { color: var(--muted); font-size: 12px; letter-spacing: 2px; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 1200 / 704;
      max-height: 760px;
      overflow: hidden;
      isolation: isolate;
    }
    .intro { position: absolute; z-index: 1; top: 7%; left: 0; pointer-events: none; }
    .eyebrow { margin: 0 0 17px; font-size: 10px; font-weight: 600; letter-spacing: 3px; }
    .eyebrow span { display: inline-block; width: 21px; height: 1px; background: var(--orange); vertical-align: middle; margin-right: 10px; }
    h1 { font-size: clamp(32px, 3.7vw, 56px); font-weight: 500; line-height: 1.45; letter-spacing: -2px; margin: 0; }
    .intro-copy { margin: 15px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 2px; }
    .art { display: block; width: 100%; height: 100%; overflow: visible; }
    .scene-note { position: absolute; right: 4px; top: 8%; writing-mode: vertical-rl; color: var(--muted); font-size: 11px; letter-spacing: 5px; }
    .scene-index { position: absolute; left: 0; bottom: 4%; color: var(--muted); font-family: Georgia, serif; font-style: italic; font-size: 13px; }
    .controls {
      padding: 24px 0 26px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }
    .play-control { display: flex; align-items: center; gap: 15px; }
    .play-button {
      width: 49px; height: 49px; padding: 0; border: 1px solid var(--ink); border-radius: 50%;
      background: var(--ink); color: var(--paper); cursor: pointer;
      display: grid; place-items: center;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }
    .play-button:hover { background: var(--paper); color: var(--ink); transform: translateY(-2px); }
    .play-button svg { width: 17px; height: 17px; }
    .play-icon { display: none; }
    .play-button[data-paused="true"] .pause-icon { display: none; }
    .play-button[data-paused="true"] .play-icon { display: block; }
    .play-caption { display: grid; gap: 5px; min-width: 104px; }
    #play-label { font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .shortcut { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
    .journey-caption { font-size: 12px; letter-spacing: 3px; color: #697b6e; }
    .journey-caption span { padding: 0 13px; color: #b2b9ab; }
    .speed-control { display: grid; grid-template-columns: auto 136px 43px; align-items: center; gap: 17px; }
    .speed-control label { font-size: 11px; letter-spacing: 2px; }
    input[type="range"] { width: 136px; height: 24px; margin: 0; accent-color: var(--ink); cursor: pointer; }
    output { font: 12px ui-monospace, Consolas, monospace; text-align: right; }
    footer { display: flex; justify-content: space-between; padding: 0 0 24px; color: #8b9388; font-size: 9px; letter-spacing: 2px; }
    .footer-right { display: flex; align-items: center; gap: 8px; }
    .footer-dot { width: 5px; height: 5px; border-radius: 50%; background: #8a9b73; }
    .noscript { padding: 12px; color: #9b472d; text-align: center; font-size: 13px; }
    @media (min-width: 1600px) { .scene { max-height: calc(100svh - 220px); } }
    @media (max-width: 800px) {
      .page { padding: 0 28px; }
      .masthead { min-height: 82px; }
      .brand-name { font-size: 14px; letter-spacing: 2px; }
      .masthead-note { font-size: 10px; letter-spacing: 1px; }
      .scene { min-height: 510px; aspect-ratio: auto; }
      .art { position: absolute; left: -25%; bottom: 0; width: 150%; height: auto; }
      .intro { top: 28px; }
      h1 { font-size: 39px; }
      .intro-copy { font-size: 11px; }
      .journey-caption { display: none; }
      .speed-control { gap: 11px; grid-template-columns: auto 100px 43px; }
      input[type="range"] { width: 100px; }
    }
    @media (max-width: 480px) {
      .page { padding: 0 22px; }
      .masthead { min-height: 76px; }
      .masthead-note { display: none; }
      .scene { min-height: 510px; }
      .art { width: 208%; left: -54%; bottom: 10px; }
      .scene-note { top: 39px; }
      .scene-index { bottom: 24px; font-size: 11px; }
      .intro { top: 33px; }
      .controls { padding: 21px 0; gap: 16px; }
      .play-control { gap: 10px; }
      .play-button { width: 43px; height: 43px; }
      .play-caption { min-width: 79px; }
      #play-label { font-size: 12px; }
      .shortcut { font-size: 9px; letter-spacing: 0; }
      .speed-control { grid-template-columns: 76px 36px; gap: 8px; }
      .speed-control label { grid-column: 1 / -1; font-size: 10px; }
      input[type="range"] { width: 76px; height: 18px; }
      output { font-size: 11px; }
      footer { font-size: 8px; letter-spacing: 1px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" stroke="currentColor"/>
          <path d="M10 26c1-6 8-5 10-10 1-4 4-6 7-4l4 3-9 1c1 6-2 13-9 12m8-14 8 1M12 28l-2 3m7-3-1 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="26" cy="13" r=".9" fill="currentColor"/>
        </svg>
        <span class="brand-name">慢骑俱乐部</span>
      </div>
      <span class="masthead-note">把今天，交给海风。</span>
    </header>

    <main>
      <section class="scene" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow"><span></span>THE PELICAN'S DAY OFF</p>
          <h1 id="page-title">骑慢一点，<br>风景刚刚好。</h1>
          <p class="intro-copy">一只鹈鹕，一辆单车，一路好心情。</p>
        </div>
        <div class="scene-note" aria-hidden="true">海岸漫游 · 没有目的地</div>

        <svg id="landscape" class="art" viewBox="0 0 1200 704" role="img" aria-labelledby="art-title art-description">

            </g>

            </g>

              <circle r="91" stroke="#7f9581" stroke-width="2"/>
            </g>
            <g id="road-tile" stroke-linecap="round">

              <path d="M164 674h24m208-2h12m145 0h19m361 2h23m142-1h18" stroke="#91a184" stroke-width="2"/>
              <g fill="#c7cbb3" stroke="none">

                <ellipse cx="754" cy="683" rx="3" ry="1.5"/>

              </g>

              <path d="M0 0q4-39-7-70M0-12q-24-7-30-31M1-30q21-9 23-26" fill="none"/>
              <path d="M-7-48q-23-8-18-25 17 4 18 25M-5-57q16-10 10-23-15 6-10 23M-18-28q-20 1-22-15 16-4 22 15M13-41q-1-20 14-26 8 18-14 26M-1-12q21-14 30-3-9 14-30 3" fill="#849b77" stroke="none"/>
            </g>
          </defs>

          <g clip-path="url(#scenery-window)">
            <circle cx="1000" cy="145" r="58" fill="#ead69b"/>
            <circle cx="1000" cy="145" r="70" fill="none" stroke="#e6dbc0" stroke-width="1" stroke-dasharray="2 9"/>
            <g id="clouds" opacity=".87">

            </g>

              </g>

              <path d="M498 413q28 0 51 5" fill="none" stroke="#c39a6b" stroke-width="2" stroke-linecap="round"/>
              <path d="M408 568 595 553a26 26 0 0 1 5 52l-192-16a11 11 0 0 1 0-21Z" fill="#d8dcc1" stroke="#526f57" stroke-width="2.5"/>
              <path d="m420 577 166-13" stroke="#bac6a7" stroke-width="2"/>
              <circle cx="598" cy="578" r="22" fill="#839780" stroke="#3b5b46" stroke-width="3"/>
              <circle cx="598" cy="578" r="15" fill="none" stroke="#c5cfb4" stroke-width="1.5" stroke-dasharray="2 4"/>
              <path id="crank" d="M562 578h72" fill="none" stroke="#4c6654" stroke-width="7" stroke-linecap="round"/>
              <circle cx="598" cy="578" r="6" fill="#dddcc8" stroke="#45624f" stroke-width="2"/>
              <path id="far-pedal" d="M547 581h30" stroke="#344b3f" stroke-width="6" stroke-linecap="round"/>
              <path id="near-pedal" d="M619 581h30" stroke="#344b3f" stroke-width="6" stroke-linecap="round"/>

        </svg>
        <span class="scene-index">Fig. 01 — A little ride, a little joy.</span>
      </section>

      <div class="controls" role="group" aria-label="动画控制">
        <div class="play-control">
          <button class="play-button" id="play-toggle" type="button" aria-label="暂停动画" aria-controls="landscape" data-paused="false">
            <svg class="pause-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="3" width="3" height="14" rx="1"/><rect x="12" y="3" width="3" height="14" rx="1"/></svg>
            <svg class="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="m6 3 11 7-11 7Z"/></svg>
          </button>
          <div class="play-caption"><span id="play-label" aria-live="polite">暂停片刻</span><span class="shortcut">空格键 · 播放 / 暂停</span></div>
        </div>
        <div class="journey-caption">海风很轻<span>/</span>今天不赶路</div>
        <div class="speed-control">
          <label for="speed">骑行速度</label>
          <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-valuetext="1 倍速">
          <output id="speed-value" for="speed">1.00×</output>
        </div>
      </div>
    </main>
    <footer><span>沿着海岸，慢慢来。</span><span class="footer-right"><i class="footer-dot" aria-hidden="true"></i>好天气 · 好心情</span></footer>
    <noscript><p class="noscript">当前浏览器禁用了 JavaScript，画面保持静止。启用 JavaScript 后可播放骑行动画。</p></noscript>
  </div>

  <script>
    'use strict';

    const byId = (id) => document.getElementById(id);
    const parts = Object.fromEntries([
      'rear-spokes', 'front-spokes', 'crank', 'near-pedal', 'far-pedal',
      'near-leg-line', 'near-leg-light', 'far-leg-line', 'near-foot', 'far-foot',
      'pelican', 'eye', 'scarf-tail', 'scarf-tail-back', 'clouds', 'gulls',
      'dunes', 'road', 'foreground', 'water', 'sailboat', 'breeze', 'bike-shadow'
    ].map((id) => [id, byId(id)]));
    const playButton = byId('play-toggle');
    const playLabel = byId('play-label');
    const speedInput = byId('speed');
    const speedValue = byId('speed-value');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const TAU = Math.PI * 2;
    let playing = !motionPreference.matches;
    let speed = Number(speedInput.value);
    let elapsed = 0;
    let lastTimestamp = null;
    let animationFrame = null;

    function setAttribute(id, attribute, value) {
      parts[id].setAttribute(attribute, value);
    }

    // Solve a two-segment leg so the foot always meets its moving pedal.
    function legPath(hipX, hipY, footX, footY) {
      const thigh = 94;
      const shin = 102;
      const dx = footX - hipX;
      const dy = footY - hipY;
      const distance = Math.hypot(dx, dy);
      const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
      const outward = Math.sqrt(thigh * thigh - along * along);
      const kneeX = hipX + (along * dx + outward * dy) / distance;
      const kneeY = hipY + (along * dy - outward * dx) / distance;
      return `M${hipX} ${hipY} Q${kneeX - 3} ${kneeY - 3} ${kneeX} ${kneeY} L${footX} ${footY}`;
    }

    function draw(time) {
      const phase = time * 2.5;
      const bob = Math.sin(phase * 2) * 2.2;
      const nearX = 598 + Math.cos(phase) * 36;
      const nearY = 578 + Math.sin(phase) * 36;
      const farX = 598 - Math.cos(phase) * 36;
      const farY = 578 - Math.sin(phase) * 36;
      const nearLeg = legPath(557, 437 + bob, nearX, nearY - 4);
      const farLeg = legPath(548, 433 + bob, farX, farY - 4);
      const wheelDegrees = (phase * 180 / Math.PI * 1.45) % 360;
      const travel = phase * 106 * 1.45;

      setAttribute('rear-spokes', 'transform', `rotate(${wheelDegrees})`);
      setAttribute('front-spokes', 'transform', `rotate(${wheelDegrees})`);
      setAttribute('crank', 'd', `M${farX} ${farY} L${nearX} ${nearY}`);
      setAttribute('near-pedal', 'd', `M${nearX - 15} ${nearY + 3}h30`);
      setAttribute('far-pedal', 'd', `M${farX - 15} ${farY + 3}h30`);
      setAttribute('near-leg-line', 'd', nearLeg);
      setAttribute('near-leg-light', 'd', nearLeg);
      setAttribute('far-leg-line', 'd', farLeg);
      setAttribute('near-foot', 'd', `M${nearX - 16} ${nearY - 4}q14-10 33-1l14 8q-20 5-45 0Z`);
      setAttribute('far-foot', 'd', `M${farX - 16} ${farY - 4}q18-8 36 0l-2 6h-31Z`);
      setAttribute('pelican', 'transform', `translate(0 ${bob})`);

      const flutter = Math.sin(phase * 2.3) * 8;
      const secondFlutter = Math.sin(phase * 2.3 - 1) * 6;
      setAttribute('scarf-tail', 'd', `M634 271C593 ${286 + flutter} 549 ${257 - flutter} 500 ${276 + secondFlutter}l17 7-7 15c44-17 83 ${5 + flutter} 128 ${-10 - secondFlutter}Z`);
      setAttribute('scarf-tail-back', 'd', `M631 276C595 ${278 - flutter} 574 ${243 + flutter} 534 ${257 + secondFlutter}l6 13-18 5c46-5 69 ${28 - flutter} 109 ${16 - secondFlutter}Z`);

      const blinkTime = time % 5.7;
      const eyeScale = blinkTime > 5.48 ? 1 - Math.sin((blinkTime - 5.48) / .22 * Math.PI) * .94 : 1;
      setAttribute('eye', 'transform', `translate(668 201) scale(1 ${eyeScale})`);
      setAttribute('road', 'transform', `translate(${-travel % 1200} 0)`);
      setAttribute('foreground', 'transform', `translate(${-travel % 1200} 0)`);
      setAttribute('dunes', 'transform', `translate(${-(travel * .19) % 1200} 0)`);
      setAttribute('clouds', 'transform', `translate(${-(time * 6) % 1200} 0)`);
      setAttribute('water', 'stroke-dashoffset', time * 8);
      setAttribute('gulls', 'transform', `translate(${Math.sin(time * .25) * 14} ${Math.sin(time * .8) * 4})`);
      setAttribute('sailboat', 'transform', `translate(${1020 + Math.sin(time * .13) * 24} ${450 + Math.sin(time * 1.1) * 2})`);
      setAttribute('breeze', 'transform', `translate(${Math.sin(phase) * 7} 0)`);
      setAttribute('breeze', 'opacity', .35 + Math.sin(phase) * .15);
      setAttribute('bike-shadow', 'rx', 308 + bob * 2);
    }

    function syncControls() {
      playButton.dataset.paused = String(!playing);
      playButton.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
      playLabel.textContent = playing ? '暂停片刻' : '继续骑行';
    }

    function frame(timestamp) {
      animationFrame = null;
      if (!playing || document.hidden) return;
      if (lastTimestamp !== null) elapsed += (timestamp - lastTimestamp) / 1000 * speed;
      lastTimestamp = timestamp;
      draw(elapsed);
      animationFrame = requestAnimationFrame(frame);
    }

    function schedule() {
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      lastTimestamp = null;
      if (playing && !document.hidden) animationFrame = requestAnimationFrame(frame);
    }

    function togglePlayback() {
      playing = !playing;
      syncControls();
      schedule();
    }

    playButton.addEventListener('click', togglePlayback);
    speedInput.addEventListener('input', () => {
      speed = Number(speedInput.value);
      speedValue.value = `${speed.toFixed(2)}×`;
      speedInput.setAttribute('aria-valuetext', `${speed} 倍速`);
    });
    document.addEventListener('keydown', (event) => {
      if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target instanceof Element && event.target.closest('button, input, select, textarea, a, [contenteditable]')) return;
      event.preventDefault();
      togglePlayback();
    });
    document.addEventListener('visibilitychange', schedule);
    motionPreference.addEventListener('change', (event) => {
      if (event.matches) {
        playing = false;
        syncControls();
        schedule();
      }
    });

    draw(0);
    syncControls();
    schedule();
  </script>
</body>
</html>
