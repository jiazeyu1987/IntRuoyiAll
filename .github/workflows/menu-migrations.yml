name: Menu migration gate

on:
  pull_request:
  push:
    branches: [int_main]

jobs:
  menu-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p test_menu_migration_gate.py
      - run: python scripts/preflight/check-menu-migrations.py --revision HEAD
