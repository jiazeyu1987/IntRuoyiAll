<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">骑着自行车的乌鸦</title>
  <desc id="desc">一只戴着小帽子的乌鸦骑着自行车向前行驶，车轮、翅膀、脚蹬和背景都带有循环动画。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3542"/>
      <stop offset="1" stop-color="#10131b"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="expanded"/>
      <feFlood flood-color="#080b12" result="color"/>
      <feComposite in="color" in2="expanded" operator="in" result="stroke"/>
      <feMerge>
        <feMergeNode in="stroke"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="cloud">
      <ellipse cx="0" cy="18" rx="74" ry="20" fill="#fff" opacity=".75"/>
      <circle cx="-40" cy="7" r="29" fill="#fff" opacity=".8"/>
      <circle cx="-2" cy="-8" r="40" fill="#fff" opacity=".88"/>
      <circle cx="40" cy="8" r="30" fill="#fff" opacity=".8"/>
    </g>

    <g id="wheel">
      <circle r="82" fill="#111827" stroke="#0b0f18" stroke-width="8"/>
      <circle r="66" fill="none" stroke="#94a3b8" stroke-width="4"/>
      <circle r="10" fill="#cbd5e1" stroke="#111827" stroke-width="5"/>
      <g stroke="#a9b7c8" stroke-width="3" opacity=".86">
        <path d="M0-10V-66M0 10V66M-10 0H-66M10 0H66M-7-7L-47-47M7 7L47 47M7-7L47-47M-7 7L-47 47"/>
      </g>
    </g>
  </defs>

  <style>
    .road-mark { animation: roadMove 1.15s linear infinite; }
    .wheel-spin { animation: spin .95s linear infinite; transform-box: fill-box; transform-origin: center; }
    .crow-bob { animation: bob 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .wing-flap { animation: flap .62s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 86% 70%; }
    .pedal-spin { animation: spin .95s linear infinite; transform-box: fill-box; transform-origin: center; }
    .feather-twitch { animation: twitch 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .blink { animation: blink 4.8s steps(1, end) infinite; transform-box: fill-box; transform-origin: center; }
    .cloud-drift { animation: cloudDrift 24s linear infinite; }
    .cloud-drift-slow { animation: cloudDrift 35s linear infinite reverse; }
    @keyframes roadMove { from { transform: translateX(0); } to { transform: translateX(-180px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
    @keyframes flap { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(13deg) translateY(-9px); } }
    @keyframes twitch { 0%, 72%, 100% { transform: rotate(0deg); } 78% { transform: rotate(-7deg); } 84% { transform: rotate(4deg); } }
    @keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 45%, 47% { transform: scaleY(.12); } }
    @keyframes cloudDrift { from { transform: translateX(-160px); } to { transform: translateX(1360px); } }
  </style>

  <rect width="1200" height="760" fill="url(#sky)"/>
  <circle cx="1010" cy="125" r="58" fill="#fff6be" opacity=".84"/>
  <circle cx="1010" cy="125" r="82" fill="none" stroke="#fff6be" stroke-width="3" opacity=".3"/>

  <g class="cloud-drift" opacity=".88">
    <use href="#cloud" x="50" y="152"/>
    <use href="#cloud" x="430" y="92" transform="scale(.72)"/>
    <use href="#cloud" x="870" y="220" transform="scale(.58)"/>
  </g>
  <g class="cloud-drift-slow" opacity=".45">
    <use href="#cloud" x="280" y="255" transform="scale(.65)"/>
    <use href="#cloud" x="1060" y="330" transform="scale(.48)"/>
  </g>

  <path d="M0 488 Q170 426 340 480 T680 478 T1020 462 T1320 478 L1320 760 H0Z" fill="#90c96d"/>
  <path d="M0 552 Q200 502 380 550 T760 536 T1160 544 T1320 530 L1320 760 H0Z" fill="#65a951"/>
  <path d="M0 638 Q200 618 420 640 T850 630 T1240 642 L1240 760 H0Z" fill="url(#road)"/>
  <path d="M0 640 Q220 620 430 642 T860 633 T1240 644" fill="none" stroke="#94a3b8" stroke-width="5" opacity=".62"/>

  <g class="road-mark" opacity=".75">
    <path d="M40 687 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
    <path d="M290 674 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
    <path d="M540 686 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
    <path d="M790 673 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
    <path d="M1040 684 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g class="road-mark" opacity=".75" transform="translate(180 0)">
    <path d="M40 687 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
    <path d="M290 674 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
    <path d="M540 686 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
    <path d="M790 673 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
    <path d="M1040 684 h120" stroke="#f7d77a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <ellipse cx="598" cy="630" rx="286" ry="34" fill="#0d1119" opacity=".3" filter="url(#softShadow)"/>

  <g transform="translate(120 18)">
    <g class="wheel-spin" transform="translate(302 569)">
      <use href="#wheel"/>
    </g>
    <g class="wheel-spin" transform="translate(712 569)">
      <use href="#wheel"/>
    </g>

    <g fill="none" stroke="#dcf4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#outline)">
      <path d="M302 569 L423 446 L535 569 L302 569 L712 569 L535 569 L605 446 L423 446"/>
      <path d="M423 446 L392 376"/>
      <path d="M605 446 L690 381"/>
      <path d="M673 379 L710 379"/>
      <path d="M382 374 L445 374"/>
    </g>
    <path d="M302 569 L423 446 L535 569" fill="none" stroke="#61d9ea" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <path d="M535 569 L605 446 L712 569" fill="none" stroke="#f4b9ff" stroke-width="5" stroke-linecap="round" opacity=".9"/>

    <g class="pedal-spin" transform="translate(535 569)">
      <circle r="18" fill="#10131b" stroke="#e7f7ff" stroke-width="5"/>
      <path d="M0 0 L40 22 M0 0 L-36 -22" stroke="#e7f7ff" stroke-width="6" stroke-linecap="round"/>
      <path d="M40 22 h28 M-36 -22 h-28" stroke="#f7d77a" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g class="crow-bob" filter="url(#outline)">
      <path d="M452 370 Q423 331 454 292 Q485 254 541 269 Q583 281 598 321 Q611 356 585 388 Q557 419 501 405 Q471 396 452 370Z" fill="url(#feather)"/>
      <path d="M560 317 Q613 293 650 310 Q617 330 579 345Z" fill="#161b28"/>
      <path d="M648 310 L680 302 L652 327Z" fill="#f7b955"/>
      <path d="M491 282 Q509 239 552 224 Q584 217 600 244 Q585 270 552 281Z" fill="#161b28"/>
      <path d="M503 251 Q540 234 576 245" fill="none" stroke="#69d6ff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="555" cy="308" r="10" fill="#fff"/>
      <circle cx="558" cy="309" r="5" fill="#0a0d14"/>
      <path class="blink" d="M545 307 q12 -13 24 0 q-12 13 -24 0Z" fill="none" stroke="#10131b" stroke-width="5"/>
      <path d="M504 365 Q544 393 585 360 Q575 406 530 416 Q500 410 504 365Z" fill="#202636"/>

      <g class="wing-flap">
        <path d="M499 320 Q434 303 404 344 Q445 351 474 375 Q432 369 420 395 Q472 410 527 374 Q545 352 499 320Z" fill="#252c3b"/>
        <path d="M465 338 Q446 345 430 359 M470 354 Q447 367 432 383" fill="none" stroke="#566176" stroke-width="5" stroke-linecap="round"/>
      </g>

      <path d="M505 395 Q509 441 463 462" fill="none" stroke="#111722" stroke-width="17" stroke-linecap="round"/>
      <path d="M572 391 Q591 426 620 452" fill="none" stroke="#111722" stroke-width="17" stroke-linecap="round"/>
      <path d="M458 461 Q484 471 507 459" fill="none" stroke="#f3b64b" stroke-width="9" stroke-linecap="round"/>
      <path d="M615 451 Q640 460 660 447" fill="none" stroke="#f3b64b" stroke-width="9" stroke-linecap="round"/>

      <g class="feather-twitch">
        <path d="M481 289 Q451 268 435 279 Q449 296 468 303" fill="#343c4f"/>
        <path d="M475 300 Q445 288 431 302 Q449 314 470 318" fill="#343c4f"/>
      </g>
    </g>

    <g opacity=".85">
      <path d="M470 237 Q500 222 527 231" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M443 250 Q459 236 477 235" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    </g>
  </g>

  <g transform="translate(50 60)">
    <rect width="300" height="80" rx="22" fill="#0f172a" opacity=".8"/>
    <text x="26" y="35" fill="#b9efff" font-family="Arial, sans-serif" font-size="22" font-weight="700">CROW ON THE GO</text>
    <text x="26" y="59" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">SVG animation · pure vector · no script</text>
  </g>
</svg>
